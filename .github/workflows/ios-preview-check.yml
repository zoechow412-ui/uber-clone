name: Expo SDK 57 iOS checks

on:
  push:
    branches:
      - upgrade/expo57-ios-preview-20261009
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expo57-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Commit lockfile for reproducible EAS builds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock Expo SDK 57 dependencies [skip ci]'
            git push
          fi
      - name: Verify Expo packages
        run: npx expo install --check
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist --clear
